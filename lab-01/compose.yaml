
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: catshop-app:section3
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/catshop
      DB_RETRIES: "30"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: catshop
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catshop"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

volumes:
  postgres_data:
